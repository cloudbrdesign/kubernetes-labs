# Step 6: ask for a slice of one GPU: 64Gi of memory and 20 of its 100 compute units.
# Needs the driver installed with gpuAllowMultipleAllocations=true.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: slice-c
spec:
  devices:
    requests:
    - name: gpu
      exactly:
        deviceClassName: gpu.example.com
        capacity:
          requests:
            memory: 64Gi
            compute: "20"
---
apiVersion: v1
kind: Pod
metadata:
  name: slice-c
spec:
  containers:
  - name: app
    image: busybox:1.36.1
    command: ["sh", "-c", "env | grep GPU_DEVICE | sort; sleep 3600"]
    resources:
      claims:
      - name: gpu
  resourceClaims:
  - name: gpu
    resourceClaimName: slice-c
