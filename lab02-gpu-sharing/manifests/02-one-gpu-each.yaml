# Step 2: two pods, each with its own claim, on a cluster with ONE (mock) GPU.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: one-gpu
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.example.com
---
apiVersion: v1
kind: Pod
metadata:
  name: trainer-a
spec:
  containers:
  - name: app
    image: busybox:1.36.1
    command: ["sh", "-c", "env | grep GPU_DEVICE | sort; sleep 3600"]
    resources:
      claims:
      - name: gpu
  resourceClaims:
  - name: gpu
    resourceClaimTemplateName: one-gpu
---
apiVersion: v1
kind: Pod
metadata:
  name: trainer-b
spec:
  containers:
  - name: app
    image: busybox:1.36.1
    command: ["sh", "-c", "env | grep GPU_DEVICE | sort; sleep 3600"]
    resources:
      claims:
      - name: gpu
  resourceClaims:
  - name: gpu
    resourceClaimTemplateName: one-gpu
