# A pod that asks for one GPU. GPUs go in `limits`; Kubernetes uses the limit as the request.
# The toleration lets it run on the GPU node once we taint that node (step 4).
apiVersion: v1
kind: Pod
metadata:
  name: gpu-pod-1
  labels: {lab: lab01}
spec:
  containers:
  - name: app
    image: busybox:1.36.1
    command: ["sh", "-c", "echo 'pretending to train'; sleep 3600"]
    resources:
      limits:
        nvidia.com/gpu: 1
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
