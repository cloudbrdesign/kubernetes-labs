# Three replicas, one GPU each. With the real GPU node already full, they should spread across the fake GPU nodes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer
  labels: {lab: lab01}
spec:
  replicas: 3
  selector:
    matchLabels: {app: trainer}
  template:
    metadata:
      labels: {app: trainer, lab: lab01}
    spec:
      containers:
      - name: app
        image: busybox:1.36.1
        command: ["sh", "-c", "sleep 3600"]
        resources:
          limits:
            nvidia.com/gpu: 1
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: kwok.x-k8s.io/node
        operator: Exists
        effect: NoSchedule
