# Three fake GPU nodes, managed by KWOK. They advertise one nvidia.com/gpu each.
# KWOK's own taint keeps real workloads off fake nodes; only pods that tolerate it land here.
---
apiVersion: v1
kind: Node
metadata:
  name: kwok-gpu-0
  annotations:
    node.alpha.kubernetes.io/ttl: "0"
    kwok.x-k8s.io/node: fake
  labels:
    kubernetes.io/hostname: kwok-gpu-0
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    type: kwok
spec:
  taints:
  - effect: NoSchedule
    key: kwok.x-k8s.io/node
    value: fake
status:
  allocatable:
    cpu: "32"
    memory: 256Gi
    pods: "110"
    nvidia.com/gpu: "1"
  capacity:
    cpu: "32"
    memory: 256Gi
    pods: "110"
    nvidia.com/gpu: "1"
---
