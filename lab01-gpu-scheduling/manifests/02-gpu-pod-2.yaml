# The same request again. One advertised GPU serves exactly one pod: this one should wait.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-pod-2
  labels: {lab: lab01}
spec:
  containers:
  - name: app
    image: busybox:1.36.1
    command: ["sh", "-c", "echo 'pretending to train'; sleep 3600"]
    resources:
      limits:
        nvidia.com/gpu: 1
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
